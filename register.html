<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Grand Vista</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        body {
            background-color: #f3f4f6;
        }

        .login-card {
            background: white;
            padding: 2.5rem;
            border-radius: 0.5rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
        }

        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .hotel-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            display: inline-block;
        }

        .error-message {
            color: #dc2626;
            background-color: #fee2e2;
            padding: 0.75rem;
            border-radius: 0.375rem;
            margin-bottom: 1rem;
            font-size: 0.875rem;
            display: none;
        }

        .success-message {
            color: #166534;
            background-color: #dcfce7;
            padding: 0.75rem;
            border-radius: 0.375rem;
            margin-bottom: 1rem;
            font-size: 0.875rem;
            display: none;
        }
    </style>
    <script>
        // Restrict access to MANAGER role only
        const userInfoStr = localStorage.getItem('userInfo');
        if (!userInfoStr) {
            window.location.href = 'index.html';
        } else {
            const userInfo = JSON.parse(userInfoStr);
            if (userInfo.role !== 'MANAGER') {
                window.location.href = 'home.html';
            }
        }
    </script>
</head>

<body>
    <div id="layout-container"></div>
    <main class="container" style="padding-top: 2rem; padding-bottom: 2rem; max-width: 600px; margin: 0 auto;">
        <div class="mb-8 text-center" style="margin-bottom: 2rem; text-align: center;">
            <div class="hotel-icon" style="font-size: 2.5rem; margin-bottom: 0.5rem; display: inline-block;">🏨</div>
            <h1 style="font-size: 1.875rem; font-weight: 700; color: #333;">Staff Management</h1>
            <p style="color: var(--primary-color); font-size: 0.875rem; margin-top: 0.5rem;">Register a new staff
                account to access the management dashboard.</p>
        </div>

        <div id="errorMessage" class="error-message"></div>
        <div id="successMessage" class="success-message"></div>

        <form id="register-form" onsubmit="handleRegister(event)" class="bg-white rounded-xl shadow-sm p-6"
            style="border: 1px solid var(--border-color); padding: 2rem; border-radius: 0.75rem; background: white; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);">

            <div class="form-group" style="margin-bottom: 1.5rem;">
                <label class="label" for="fullName"
                    style="display: block; margin-bottom: 0.5rem; font-weight: 500; color: #374151;">Full Name</label>
                <input type="text" id="fullName" class="input" placeholder="John Doe" required
                    style="width: 100%; padding: 0.75rem; border: 1px solid #d1d5db; border-radius: 0.375rem; outline: none;">
            </div>

            <div class="form-group" style="margin-bottom: 1.5rem;">
                <label class="label" for="email"
                    style="display: block; margin-bottom: 0.5rem; font-weight: 500; color: #374151;">Email
                    Address</label>
                <input type="email" id="email" class="input" placeholder="staff@boutiquehotel.com" required
                    style="width: 100%; padding: 0.75rem; border: 1px solid #d1d5db; border-radius: 0.375rem; outline: none;">
            </div>

            <div class="form-group" style="margin-bottom: 2rem;">
                <label class="label" for="role"
                    style="display: block; margin-bottom: 0.5rem; font-weight: 500; color: #374151;">Role</label>
                <select id="role" class="input" required
                    style="width: 100%; padding: 0.75rem; border: 1px solid #d1d5db; border-radius: 0.375rem; outline: none; background-color: white;">
                    <option value="RECEPTIONIST">Receptionist</option>
                    <option value="MANAGER">Manager</option>
                </select>
            </div>

            <button type="submit" id="submitBtn" class="btn btn-primary"
                style="width: 100%; padding: 0.75rem; background-color: var(--primary-color); color: white; border: none; border-radius: 0.375rem; font-weight: 600; cursor: pointer; transition: background-color 0.2s;">
                Create Account &rarr;
            </button>
        </form>
    </main>

    <script src="assets/js/main.js"></script>
    <script>
        // Use main.js layout function
        document.addEventListener('DOMContentLoaded', () => {
            if (typeof renderLayout === 'function') {
                renderLayout();
            }
        });

        async function handleRegister(e) {
            e.preventDefault();

            const fullName = document.getElementById('fullName').value;
            const email = document.getElementById('email').value;
            const role = document.getElementById('role').value;
            const submitBtn = document.getElementById('submitBtn');
            const errorMessage = document.getElementById('errorMessage');
            const successMessage = document.getElementById('successMessage');

            // Reset messages
            errorMessage.style.display = 'none';
            successMessage.style.display = 'none';
            submitBtn.disabled = true;
            submitBtn.textContent = 'Creating Account...';

            try {
                // Construct JSON request body
                const requestBody = {
                    email: email,
                    fullName: fullName,
                    role: role
                };

                const response = await fetch('http://localhost:8081/api/auth/register', {
                    method: 'POST',
                    headers: {
                        'Accept': 'application/json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(requestBody)
                });

                if (response.ok) {
                    successMessage.textContent = 'Registration successful! Redirecting to login...';
                    successMessage.style.display = 'block';

                    // Clear form
                    e.target.reset();

                    // Optional: redirect to staff list or show success
                    setTimeout(() => {
                        window.location.href = 'home.html';
                    }, 2000);
                } else {
                    const errorText = await response.text();
                    throw new Error(errorText || 'Registration failed. Please try again.');
                }
            } catch (error) {
                console.error('Registration error:', error);
                errorMessage.textContent = error.message;
                errorMessage.style.display = 'block';
                submitBtn.disabled = false;
                submitBtn.textContent = 'Create Account →';
            }
        }
    </script>
</body>

</html>
