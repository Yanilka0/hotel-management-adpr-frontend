<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - Grand Vista</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <script>
        // Restrict access to MANAGER role only
        const userInfoStr = localStorage.getItem('userInfo');
        if (!userInfoStr) {
            window.location.href = 'index.html';
        } else {
            const userInfo = JSON.parse(userInfoStr);
            if (userInfo.role !== 'MANAGER') {
                window.location.href = 'home.html';
            }
        }
    </script>
</head>

<body>
    <div id="layout-container"></div>

    <main class="container py-8 max-w-4xl mx-auto"
        style="padding-top: 2rem; padding-bottom: 2rem; max-width: 800px; margin: 0 auto;">

        <div class="header-section" style="margin-bottom: 2rem;">
            <h2 class="text-3xl font-bold text-gray-800" style="font-size: 1.875rem; font-weight: 700; color: #1f2937;">
                System Settings</h2>
            <p class="text-gray-500 mt-2" style="color: #6b7280; margin-top: 0.5rem;">Configure global parameters for
                the Grand Vista Hotel Management System.</p>
        </div>

        <div class="card bg-white shadow-md rounded-lg p-6 mb-8"
            style="background: white; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); border-radius: 0.5rem; padding: 1.5rem; border: 1px solid #e5e7eb;">
            <h3 class="text-xl font-semibold mb-4"
                style="font-size: 1.25rem; font-weight: 600; margin-bottom: 1rem; color: #374151;">Room Availability
                Configuration</h3>

            <div id="statusMessage"
                style="display: none; padding: 0.75rem; border-radius: 0.375rem; margin-bottom: 1rem;"></div>

            <form id="settingsForm" onsubmit="handleSaveSettings(event)"
                style="display: flex; gap: 1rem; align-items: flex-end; margin-bottom: 2rem;">
                <div style="flex: 1;">
                    <label for="roomType"
                        style="display: block; font-size: 0.875rem; font-weight: 500; color: #374151; margin-bottom: 0.5rem;">Room
                        Type</label>
                    <select id="roomType" class="input w-full" required
                        style="width: 100%; padding: 0.5rem; border: 1px solid #d1d5db; border-radius: 0.375rem;">
                        <option value="Single">Single</option>
                        <option value="Double">Double</option>
                        <option value="Suite">Suite</option>
                        <option value="Deluxe">Deluxe</option>
                        <option value="Family">Family</option>
                    </select>
                </div>
                <div style="flex: 1;">
                    <label for="totalRooms"
                        style="display: block; font-size: 0.875rem; font-weight: 500; color: #374151; margin-bottom: 0.5rem;">Total
                        Rooms Capacity</label>
                    <input type="number" id="totalRooms" min="0" class="input w-full" required
                        style="width: 100%; padding: 0.5rem; border: 1px solid #d1d5db; border-radius: 0.375rem;">
                </div>
                <div>
                    <button type="submit" class="btn btn-primary"
                        style="padding: 0.5rem 1rem; background-color: var(--primary-color); color: white; border: none; border-radius: 0.375rem; cursor: pointer;">Save</button>
                </div>
            </form>

            <h4 class="font-medium text-gray-700 mb-3"
                style="font-weight: 500; color: #4b5563; margin-bottom: 0.75rem;">Current Configuration</h4>
            <div style="border: 1px solid #e5e7eb; border-radius: 0.375rem; overflow: hidden;">
                <table style="width: 100%; border-collapse: collapse; text-align: left;">
                    <thead style="background-color: #f9fafb;">
                        <tr>
                            <th
                                style="padding: 0.75rem 1rem; border-bottom: 1px solid #e5e7eb; font-weight: 500; color: #6b7280; font-size: 0.875rem;">
                                Room Type</th>
                            <th
                                style="padding: 0.75rem 1rem; border-bottom: 1px solid #e5e7eb; font-weight: 500; color: #6b7280; font-size: 0.875rem;">
                                Total Capacity</th>
                            <th
                                style="padding: 0.75rem 1rem; border-bottom: 1px solid #e5e7eb; font-weight: 500; color: #6b7280; font-size: 0.875rem; text-align: right;">
                                Actions</th>
                        </tr>
                    </thead>
                    <tbody id="settingsTableBody">
                        <tr>
                            <td colspan="3" style="padding: 1rem; text-align: center; color: #6b7280;">Loading
                                configuration...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="assets/js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            fetchSettings();
        });

        async function fetchSettings() {
            try {
                const response = await fetch('http://localhost:8081/api/settings/rooms');
                if (response.ok) {
                    const settings = await response.json();
                    renderSettingsTable(settings);
                } else {
                    throw new Error('Failed to load settings');
                }
            } catch (error) {
                console.error(error);
                const tbody = document.getElementById('settingsTableBody');
                tbody.innerHTML = `<tr><td colspan="3" style="padding: 1rem; text-align: center; color: #dc2626;">Error loading configuration</td></tr>`;
            }
        }

        function renderSettingsTable(settings) {
            const tbody = document.getElementById('settingsTableBody');

            if (settings.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" style="padding: 1rem; text-align: center; color: #6b7280;">No explicit room configurations defined yet.</td></tr>`;
                return;
            }

            tbody.innerHTML = '';

            settings.forEach(setting => {
                const tr = document.createElement('tr');
                tr.style.borderBottom = '1px solid #e5e7eb';

                tr.innerHTML = `
                    <td style="padding: 0.75rem 1rem; color: #1f2937;">${setting.roomType}</td>
                    <td style="padding: 0.75rem 1rem; color: #1f2937;">
                        <span style="display: inline-block; padding: 0.25rem 0.75rem; background-color: #dbeafe; color: #1e40af; border-radius: 9999px; font-size: 0.875rem; font-weight: 500;">
                            ${setting.totalRooms}
                        </span>
                    </td>
                    <td style="padding: 0.75rem 1rem; text-align: right;">
                        <button onclick="editSetting('${setting.roomType}', ${setting.totalRooms})" style="padding: 0.375rem 0.75rem; background-color: white; border: 1px solid #d1d5db; border-radius: 0.375rem; font-size: 0.875rem; font-weight: 500; color: #374151; cursor: pointer; transition: all 0.2s;" onmouseover="this.style.backgroundColor='#f9fafb'" onmouseout="this.style.backgroundColor='white'">
                            Edit
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function editSetting(roomType, totalRooms) {
            document.getElementById('roomType').value = roomType;
            document.getElementById('totalRooms').value = totalRooms;
            document.getElementById('totalRooms').focus();

            // Optionally change the submit button text
            const saveBtn = document.querySelector('#settingsForm button[type="submit"]');
            if (saveBtn) saveBtn.textContent = 'Update';
        }

        async function handleSaveSettings(e) {
            e.preventDefault();

            const roomType = document.getElementById('roomType').value;
            const totalRooms = parseInt(document.getElementById('totalRooms').value);
            const statusMsg = document.getElementById('statusMessage');

            try {
                const response = await fetch('http://localhost:8081/api/settings/rooms', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ roomType, totalRooms })
                });

                if (response.ok) {
                    statusMsg.textContent = 'Settings saved successfully!';
                    statusMsg.style.backgroundColor = '#dcfce7';
                    statusMsg.style.color = '#15803d';
                    statusMsg.style.display = 'block';

                    document.getElementById('totalRooms').value = '';

                    const saveBtn = document.querySelector('#settingsForm button[type="submit"]');
                    if (saveBtn) saveBtn.textContent = 'Save';

                    fetchSettings(); // Refresh
                } else {
                    const err = await response.text();
                    throw new Error(err || 'Failed to save settings');
                }
            } catch (error) {
                statusMsg.textContent = error.message;
                statusMsg.style.backgroundColor = '#fee2e2';
                statusMsg.style.color = '#b91c1c';
                statusMsg.style.display = 'block';
            }

            setTimeout(() => {
                statusMsg.style.display = 'none';
            }, 3000);
        }
    </script>
</body>

</html>
